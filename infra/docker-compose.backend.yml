name: pcapscanner-backend
x-service: &service
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  environment: &environment
    PCAP_API_TOKEN: ${PCAP_API_TOKEN:?Set PCAP_API_TOKEN securely in the environment}
    PCAP_DATA_DIR: /data
    PCAP_AI_CONFIG: /config/ai.yaml
    PCAP_PACKET_LIMIT: ${PCAP_PACKET_LIMIT:-20000}
    PCAP_PARSER_TIMEOUT_SECONDS: ${PCAP_PARSER_TIMEOUT_SECONDS:-120}
    PCAP_PARSER_MEMORY_MB: ${PCAP_PARSER_MEMORY_MB:-512}
    PCAP_ZEEK_ENABLED: ${PCAP_ZEEK_ENABLED:-1}
    PCAP_ZEEK_MAX_ROWS: ${PCAP_ZEEK_MAX_ROWS:-2000}
    PCAP_ZEEK_MAX_OUTPUT_BYTES: ${PCAP_ZEEK_MAX_OUTPUT_BYTES:-33554432}
    PCAP_ZEEK_TIMEOUT_SECONDS: ${PCAP_ZEEK_TIMEOUT_SECONDS:-45}
    PCAP_ZEEK_MEMORY_MB: ${PCAP_ZEEK_MEMORY_MB:-256}
    PCAP_YARA_ENABLED: ${PCAP_YARA_ENABLED:-1}
    PCAP_YARA_RULES_DIR: /rules
    PCAP_YARA_MAX_RULES_FILES: ${PCAP_YARA_MAX_RULES_FILES:-64}
    PCAP_YARA_MAX_RULES_BYTES: ${PCAP_YARA_MAX_RULES_BYTES:-16777216}
    PCAP_YARA_MAX_OBJECTS: ${PCAP_YARA_MAX_OBJECTS:-100}
    PCAP_YARA_MAX_OBJECT_BYTES: ${PCAP_YARA_MAX_OBJECT_BYTES:-16777216}
    PCAP_YARA_MAX_TOTAL_BYTES: ${PCAP_YARA_MAX_TOTAL_BYTES:-67108864}
    PCAP_YARA_MAX_MATCHES: ${PCAP_YARA_MAX_MATCHES:-200}
    PCAP_YARA_MAX_OUTPUT_BYTES: ${PCAP_YARA_MAX_OUTPUT_BYTES:-1048576}
    PCAP_YARA_TIMEOUT_SECONDS: ${PCAP_YARA_TIMEOUT_SECONDS:-30}
    PCAP_YARA_MEMORY_MB: ${PCAP_YARA_MEMORY_MB:-256}
    PCAP_QUEUE_LIMIT: ${PCAP_QUEUE_LIMIT:-8}
    PCAP_RETENTION_HOURS: ${PCAP_RETENTION_HOURS:-24}
  volumes:
    - evidence:/data
    - ${PCAP_CONFIG_PATH:-../backend/examples/ai-config.example.yaml}:/config/ai.yaml:ro
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  user: '10001:10001'
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 768m
  cpus: 1.0
  restart: unless-stopped
services:
  api:
    <<: *service
    command: [python, -m, uvicorn, backend.app.main:create_app, --factory, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    environment:
      <<: *environment
      PCAP_OSINT_ENABLED: ${PCAP_OSINT_ENABLED:-1}
      PCAP_OSINT_VIRUSTOTAL_API_KEY: ${PCAP_OSINT_VIRUSTOTAL_API_KEY:-}
      PCAP_OSINT_VIRUSTOTAL_PREMIUM_LICENSE_ACK: ${PCAP_OSINT_VIRUSTOTAL_PREMIUM_LICENSE_ACK:-0}
      PCAP_OSINT_ABUSEIPDB_API_KEY: ${PCAP_OSINT_ABUSEIPDB_API_KEY:-}
      PCAP_OSINT_ABUSEIPDB_TERMS_ACK: ${PCAP_OSINT_ABUSEIPDB_TERMS_ACK:-0}
      PCAP_OSINT_GREYNOISE_API_KEY: ${PCAP_OSINT_GREYNOISE_API_KEY:-}
      PCAP_OSINT_GREYNOISE_LICENSE_ACK: ${PCAP_OSINT_GREYNOISE_LICENSE_ACK:-0}
      PCAP_OSINT_SHODAN_API_KEY: ${PCAP_OSINT_SHODAN_API_KEY:-}
      PCAP_OSINT_SHODAN_AUTOMATION_ACK: ${PCAP_OSINT_SHODAN_AUTOMATION_ACK:-0}
      PCAP_OSINT_SHODAN_QUERY_LOG_REDACTION_ACK: ${PCAP_OSINT_SHODAN_QUERY_LOG_REDACTION_ACK:-0}
      PCAP_OSINT_OTX_API_KEY: ${PCAP_OSINT_OTX_API_KEY:-}
      PCAP_OSINT_OTX_AUTHORIZED_USE_ACK: ${PCAP_OSINT_OTX_AUTHORIZED_USE_ACK:-0}
      PCAP_AI_API_KEY: ${PCAP_AI_API_KEY:-}
      MANUS_API_URL: ${MANUS_API_URL:-}
      MANUS_API_KEY: ${MANUS_API_KEY:-}
    volumes:
      - evidence:/data
      - raw-captures:/data/captures
      - ${PCAP_CONFIG_PATH:-../backend/examples/ai-config.example.yaml}:/config/ai.yaml:ro
    ports:
      - '127.0.0.1:8000:8000'
    networks: [gateway]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
  parser:
    <<: *service
    command: [python, -m, backend.app.worker]
    volumes:
      - evidence:/data
      - raw-captures:/data/captures
      - ${PCAP_CONFIG_PATH:-../backend/examples/ai-config.example.yaml}:/config/ai.yaml:ro
      - ${PCAP_YARA_RULES_HOST_DIR:-../yara-rules}:/rules:ro
    # Internal Docker network has no external route. No capture replay/probing.
    networks: [offline]
    environment:
      <<: *environment
      PCAP_API_TOKEN: ''
  narrator:
    <<: *service
    command: [python, -m, backend.app.ai_worker]
    networks: [gateway]
    environment:
      <<: *environment
      PCAP_API_TOKEN: ''
      PCAP_AI_API_KEY: ${PCAP_AI_API_KEY:-}
      # Runtime credentials are optional and are never copied into image/config.
      MANUS_API_URL: ${MANUS_API_URL:-}
      MANUS_API_KEY: ${MANUS_API_KEY:-}
volumes:
  evidence: {}
  raw-captures: {}
networks:
  offline:
    internal: true
  gateway: {}
