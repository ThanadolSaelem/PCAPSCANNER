name: pcapscanner-tier1-inference
services:
  tier1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_NEURAL: ${INSTALL_NEURAL:-1}
    environment:
      TIER1_HOST: 0.0.0.0
      TIER1_PORT: 9000
      TIER1_DEVICE: ${TIER1_DEVICE:-auto}
      TIER1_OPENJEV_CHECKPOINT: ${TIER1_OPENJEV_CHECKPOINT:-}
      TIER1_ETBERT_CHECKPOINT: ${TIER1_ETBERT_CHECKPOINT:-}
      TIER1_BASE_MODEL: ${TIER1_BASE_MODEL:-}
      TIER1_API_TOKEN: ${TIER1_API_TOKEN:-}
      TIER1_REQUIRE_WEIGHTS: ${TIER1_REQUIRE_WEIGHTS:-0}
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
    volumes:
      - ./models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
